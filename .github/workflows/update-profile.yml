name: Atualizar perfil

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter repositório
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Gerar snake nos dois temas
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=#0E1320&color_dots=#EBEDF0,#FCE7C2,#F8C978,#EFA63A,#C97F12
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFB547&color_dots=#161D2C,#3D3220,#6E5426,#B5822F,#FFB547
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&card_width=440&locale=pt-pt&exclude_repo=franciscograca22409338&bg_color=0E1320&title_color=FFB547&text_color=B9C1CF&icon_color=FFB547&border_color=243049&hide_border=false
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Atualizar atividade pública no README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
          PROFILE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          owner = os.environ['PROFILE_OWNER']
          profile = os.environ['PROFILE_REPOSITORY'].lower()
          repos = []
          page = 1
          while True:
              url = (
                  f'https://api.github.com/users/{quote(owner, safe="")}/repos'
                  f'?type=owner&sort=pushed&direction=desc&per_page=100&page={page}'
              )
              request = Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'profile-readme-updater',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urlopen(request, timeout=30) as response:
                  batch = json.load(response)
              repos.extend(r for r in batch if (
                  not r['fork'] and not r['archived'] and not r['private']
                  and r['full_name'].lower() != profile and r.get('pushed_at')
                  and r.get('size', 0) > 0
              ))
              if len(batch) < 100:
                  break
              page += 1

          if repos:
              repo = max(repos, key=lambda r: r['pushed_at'])
              label = html.escape(repo['name'])
              link = html.escape(repo['html_url'], quote=True)
              pushed = datetime.fromisoformat(repo['pushed_at'].replace('Z', '+00:00'))
              language = html.escape(repo.get('language') or 'Não identificada')
              body = (
                  f'<p align="center"><sub>Último push público: <a href="{link}">{label}</a>, '
                  f'em {language}, a {pushed:%d/%m/%Y}.</sub></p>'
              )
          else:
              body = '<p align="center"><sub>Ainda sem repositórios públicos para mostrar.</sub></p>'

          path = Path('README.md')
          original = path.read_text(encoding='utf-8')
          original = re.sub(r'https://github-readme-stats\.vercel\.app/api/top-langs/\?[^"\s]+', './assets/top-langs.svg', original)
          start, end = '<!-- CURRENTLY:START -->', '<!-- CURRENTLY:END -->'
          if original.count(start) != 1 or original.count(end) != 1:
              raise SystemExit('O README deve conter exatamente um par de marcadores CURRENTLY.')
          before, remaining = original.split(start, 1)
          if end not in remaining:
              raise SystemExit('Os marcadores CURRENTLY estão fora de ordem.')
          _, after = remaining.split(end, 1)
          path.write_text(before + start + '\n' + body + '\n' + end + after, encoding='utf-8')
          PY

      - name: Guardar alterações
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg assets/top-langs.svg
          if git diff --cached --quiet; then
            echo "Sem alterações a publicar."
            exit 0
          fi
          git commit -m "chore: atualizar atividade e snake do perfil"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
